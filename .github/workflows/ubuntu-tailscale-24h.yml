          sudo rm -f /tmp/workspace-backup.tar.gz
        elif [ -f workspace-backup.tar.gz ]; then
          echo "Restoring initial backup from Repository file..."
          sudo tar -xzf workspace-backup.tar.gz -C /home/Neotenet/
        else
          echo "No backup file found, starting with empty workspace."
        fi
        sudo chown -R Neotenet:Neotenet /home/Neotenet/workspace

    - name: Connect Tailscale
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="session6-run-${{ github.run_id }}"
        sleep 10
        TS_IP=$(tailscale ip -4)
