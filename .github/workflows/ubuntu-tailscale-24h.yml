name: Ubuntu SSH via Tailscale (Full 33 Hours Persistent Workspace)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  session-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Maximize Disk Space (Aggressive Cleanup)
      run: |
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile /swapfile || true
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/lib/jvm
        sudo docker image prune -a --force || true
        sudo apt-get clean
        sudo apt-get autoremove -y > /dev/null 2>&1
        echo "=== وضعیت فضای دیسک ==="
        df -h /

    - name: Set Up User & Workspace
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ github.repository }}
      run: |
        echo "runner:neo_tenet" | sudo chpasswd
        sudo useradd -m -s /bin/bash Neotenet || true
        echo "Neotenet:neo_tenet" | sudo chpasswd
        sudo usermod -aG sudo Neotenet
        sudo mkdir -p /home/Neotenet/workspace
        echo "cd /home/Neotenet/workspace" | sudo tee -a /home/Neotenet/.bashrc > /dev/null
        sudo chown -R Neotenet:Neotenet /home/Neotenet/workspace /home/Neotenet/.bashrc
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config || true
        echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/99-password-auth.conf || true
        sudo systemctl restart ssh || sudo service ssh restart || true
        
        sudo bash -c "cat << 'EOF' > /usr/local/bin/stop-all
        #!/bin/bash
        echo 'Canceling all sessions and stopping workflow...'
        curl -s -X POST -H 'Authorization: token $GH_TOKEN' -H 'Accept: application/vnd.github.v3+json' 'https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel'
        sleep 4
        sudo pkill -9 -f sleep || true
        EOF"
        sudo chmod +x /usr/local/bin/stop-all

    - name: Restore Workspace Data (Initial Repo Backup)
      run: |
        if [ -f workspace-backup.tar.gz ]; then
          echo "Restoring initial backup from Repository file..."
          sudo tar -xzf workspace-backup.tar.gz -C /home/Neotenet/
        else
          echo "No repository backup file found, starting with empty workspace."
        fi
        sudo chown -R Neotenet:Neotenet /home/Neotenet/workspace

    - name: Connect Tailscale
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="session1-run-${{ github.run_id }}"
        sleep 10
        TS_IP=$(tailscale ip -4)
        echo "=========================================="
        echo "SSH Connection Details (Session 1):"
        echo "IP: $TS_IP"
        echo "User: Neotenet"
        echo "Password: neo_tenet"
        echo "SSH Command: ssh -o ConnectTimeout=10 -o ServerAliveInterval=15 -o StrictHostKeyChecking=no Neotenet@$TS_IP"
        echo "To stop ALL sessions type: stop-all"
        echo "To skip to NEXT session type: touch /tmp/skip_timer"
        echo "=========================================="

    - name: Auto-run Workspace Script
      run: |
        if [ -f /home/Neotenet/workspace/run.sh ]; then
          echo "run.sh found. Starting background execution..."
          sudo chmod +x /home/Neotenet/workspace/run.sh
          sudo -u Neotenet bash -c 'cd /home/Neotenet/workspace && nohup ./run.sh > /home/Neotenet/workspace/run.log 2>&1 &'
          echo "Process started in background."
        else
          echo "run.sh not found. Create it in /home/Neotenet/workspace/run.sh"
        fi

    - name: Keep Alive & Live Timer (5.5 Hours)
      run: |
        TOTAL_SECONDS=19800
        while [ $TOTAL_SECONDS -gt 0 ]; do
          if [ -f /tmp/skip_timer ]; then
            echo -e "\nSkip signal received! Ending Session 1 and saving backup..."
            sudo rm -f /tmp/skip_timer
            break
          fi
          HOURS=$((TOTAL_SECONDS / 3600))
          MINS=$(((TOTAL_SECONDS % 3600) / 60))
          SECS=$((TOTAL_SECONDS % 60))
          printf "\rTime remaining in Session 1: %02d:%02d:%02d" $HOURS $MINS $SECS
          sleep 5
          TOTAL_SECONDS=$((TOTAL_SECONDS - 5))
        done

    - name: Backup Workspace
      if: always()
      run: |
        sync
        cd /home/Neotenet
        sudo tar -czf /tmp/workspace-backup.tar.gz workspace/ || true

    - name: Upload Workspace Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: workspace-backup-s1
        path: /tmp/workspace-backup.tar.gz
        retention-days: 1

    - name: Cleanup Tailscale Node
      if: always()
      run: |
        sudo tailscale logout || true

